spring:
  application:
    name: backend

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: DB_POS_MASTER
    password: posmaster_password
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none # DDL handled by Phase 1 scripts
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
